<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 180" role="img" aria-labelledby="title desc"><title id="title">WikiPulse architecture</title><desc id="desc">Wikimedia events flow through a Python producer, Kafka, Spark Structured Streaming, Iceberg, and a FastAPI dashboard.</desc><rect width="1100" height="180" rx="18" fill="#0e1d2d"/><g font-family="Arial,sans-serif" fill="#e9f1ff" text-anchor="middle"><g fill="#152c3f" stroke="#4b7382" stroke-width="2"><rect x="20" y="52" width="158" height="76" rx="12"/><rect x="202" y="52" width="158" height="76" rx="12"/><rect x="384" y="52" width="158" height="76" rx="12"/><rect x="566" y="52" width="158" height="76" rx="12"/><rect x="748" y="52" width="158" height="76" rx="12"/><rect x="930" y="52" width="150" height="76" rx="12"/></g><g font-size="16" font-weight="bold"><text x="99" y="87">Wikimedia</text><text x="281" y="87">Python ingest</text><text x="463" y="87">Kafka</text><text x="645" y="87">Spark</text><text x="827" y="87">Iceberg</text><text x="1005" y="87">Dashboard</text></g><g font-size="11" fill="#a9bed0"><text x="99" y="106">EventStreams SSE</text><text x="281" y="106">cursor + DLQ</text><text x="463" y="106">3 partitions</text><text x="645" y="106">watermark + MERGE</text><text x="827" y="106">bronze / silver / gold</text><text x="1005" y="106">FastAPI live view</text></g></g><g fill="none" stroke="#5ad9c5" stroke-width="3" stroke-linecap="round"><path d="M180 90h18m164 0h18m164 0h18m164 0h18m164 0h18"/></g><g fill="#5ad9c5"><path d="m197 84 9 6-9 6m182-12 9 6-9 6m182-12 9 6-9 6m182-12 9 6-9 6m182-12 9 6-9 6"/></g></svg>
