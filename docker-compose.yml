services:
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 12

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/app/scripts/init-topics.sh"]
    volumes:
      - ./scripts:/app/scripts:ro

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: >-
      /opt/spark/bin/spark-submit
      --master local[2]
      --driver-memory 3g
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.4,org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.10.2
      /app/src/wikipulse/stream.py
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      DATA_DIR: /app/data
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
      - ./warehouse:/app/warehouse
      - ./checkpoints:/app/checkpoints
      - spark-ivy:/root/.ivy2
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["wikipulse", "ingest"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      DATA_DIR: /app/data
      WIKI_FILTER: enwiki
      WIKIPULSE_USER_AGENT: ${WIKIPULSE_USER_AGENT:?Set a User-Agent with your contact address in .env}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["uvicorn", "wikipulse.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

volumes:
  kafka-data:
  spark-ivy:
